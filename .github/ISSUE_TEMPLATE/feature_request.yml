name: Feature request
description: An idea for something new or better.
title: "[Request] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Updates come when there is free time, so a request that is concrete (what you want to do and
        how you picture it) is much easier to pick up than a general wish. One idea per issue, and a quick search of the
        existing issues and the [user guide](https://github.com/LorenzoKy/Hybrid-Launcher/blob/main/docs/user-guide.md)
        first, in case it is already there.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: |
        Describe it however you like. Useful things to mention: what you are trying to do, what gets in the way today,
        and how you picture it working in the app.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Examples, mockups or references
      description: Other apps or mods that do something similar, a sketch, a screenshot. Optional.
