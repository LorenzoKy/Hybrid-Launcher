name: Bug report
description: Something does not work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Hybrid Launcher is a personal project made in free time, so the more
        a report shows, the sooner it gets fixed: **a log and a screenshot are worth more than any description.**
        One problem per issue helps too.

        **The quickest way:** in the app, Settings → About → **Report on GitHub**. It opens this form with the version,
        your system and the log already filled in.

        Otherwise the logs are in `%LOCALAPPDATA%\HybridLauncher\logs` (paste that in the Explorer address bar): one file
        per session, named after the date and time it started.

        If it is about a mod itself (OptiScaler, ReShade, RenoDX, Luma) rather than how the app installs it, its own wiki
        or forum is usually the faster place to ask.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: |
        Tell it your way. Useful things to mention: what you were doing, what you saw, what you expected instead,
        and whether it happens every time.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: If you know how, the steps from opening the app. Skip it if it happened out of the blue.
      placeholder: |
        1. Open the page of …
        2. Click …
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About.
      placeholder: "1.0.0"
  - type: input
    id: system
    attributes:
      label: Windows, graphics card and driver
      placeholder: "Windows 11 24H2, Radeon RX 9070 XT, Adrenalin 25.10.1"
  - type: input
    id: game
    attributes:
      label: Game and store, if it is about a game
      placeholder: "Cyberpunk 2077, Steam"
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Drag the session's log file here. It is the most useful thing you can add.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Drag images or a short clip here.
